<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Library — podcast2text</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <div class="lib-header">
    <div>
      <div class="lib-title">Library</div>
      <div class="lib-subtitle">All your transcribed videos and notes in one place.</div>
    </div>
    <div class="lib-search">
      <input type="text" id="lib-search-input" placeholder="Search videos or notes">
    </div>
  </div>

  <div class="lib-body">
    <div class="lib-grid" id="lib-grid"></div>
    <div class="lib-detail" id="lib-detail">
      <div class="lib-empty">Select a video to see its bookmarks.</div>
    </div>
  </div>

  <script src="library.js"></script>
</body>
</html>
